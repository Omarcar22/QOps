name: QA Evidence

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Restore backend dependencies
        run: dotnet restore backend/QOps.slnx

      - name: Run API tests
        run: dotnet test tests/QOps.ApiTests/QOps.ApiTests.csproj --nologo --logger "trx;LogFileName=qops-api-tests.trx"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Generate test evidence report
        working-directory: frontend
        run: npm run generate:test-evidence

      - name: Upload QA evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: qops-qa-evidence
          path: |
            frontend/public/test-evidence.json
            tests/QOps.ApiTests/TestResults/*.trx
