name: Playwright QA Evidence

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
  E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}

jobs:
  e2e-and-evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore backend
        run: dotnet restore backend/QOps.slnx

      - name: Run API tests
        run: dotnet test tests/QOps.ApiTests/QOps.ApiTests.csproj --nologo --logger "trx;LogFileName=qops-api-tests.trx"

      - name: Start backend API
        run: |
          dotnet run --project backend/QOps.API/QOps.API.csproj --urls http://localhost:5091 > backend.log 2>&1 &
          sleep 20

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start frontend app
        working-directory: frontend
        run: |
          npm run dev -- --host 0.0.0.0 --port 4173 > frontend.log 2>&1 &
          sleep 20

      - name: Run Playwright smoke test
        working-directory: frontend
        run: npx playwright test --config=playwright.config.ts --reporter=line,json

      - name: Generate QA evidence artifact
        run: node scripts/generate-playwright-artifact.mjs

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qops-playwright-evidence
          path: |
            playwright-report/**
            artifacts/qa-evidence/playwright-evidence.json
            tests/QOps.ApiTests/TestResults/*.trx
          if-no-files-found: warn
