name: QOps CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: "QOps_dev_2026!"
        ports:
          - 1433:1433

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore backend/QOps.slnx

      - name: Build solution
        run: dotnet build backend/QOps.slnx --no-restore

      - name: Wait for SQL Server
        run: |
          for i in {1..30}; do
            if (echo > /dev/tcp/127.0.0.1/1433) >/dev/null 2>&1; then
              echo "SQL Server is ready"
              exit 0
            fi

            echo "Waiting for SQL Server..."
            sleep 2
          done

          echo "SQL Server failed to start"
          exit 1

      - name: Run unit tests
        run: dotnet test tests/QOps.UnitTests/QOps.UnitTests.csproj --no-restore

      - name: Run API tests
        run: dotnet test tests/QOps.ApiTests/QOps.ApiTests.csproj --no-restore
